# macOS DMG for the capture application.
#
# Unsigned and un-notarised: a Developer ID is a paid personal credential and putting one
# in a public repository's CI needs a decision about who holds it that has not been taken.
# The consequence is a Gatekeeper prompt on first launch, which the installation page
# documents rather than leaving users to discover.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package macOS DMG

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded DMG artifact
        required: false
        default: DomesdayDuplicator-macos-dmg
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

jobs:
  package:
    name: DMG
    runs-on: macos-latest
    # ~11 min observed, and this runner bills at 10x
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#gui-v}"
          else
            version="git-${GITHUB_SHA:0:8}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The commit the binary stamps into itself, which is a different thing
          # from the packaging version above: that one names the artefact, this
          # one names the source it was built from. The same stamp the FX3
          # firmware and the FPGA gateware carry — see
          # ddd-gui/src/capture/version.h. Passed explicitly because there is no
          # .git the build can ask in every packaging sandbox, and a build that
          # reports "unknown" fails the release gate.
          echo "ddd_commit=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          # A flaky Homebrew index refresh should not fail the build; the formulae that
          # matter are pinned by the runner image and by the install step below.
          for attempt in 1 2 3; do
            brew update && break
            echo "brew update failed (attempt ${attempt}), retrying..."
            sleep 15
          done || echo "brew update failed; continuing with the existing metadata"

          # googletest is a build dependency here, not just a developer convenience: this
          # job configures with -DBUILD_TESTING=ON and runs the suite before packaging, so
          # without it the configure step fails outright.
          #
          # Retried, and unlike the metadata refresh above it is fatal when it runs out of
          # attempts. The download is the part that fails — qt@6 alone is several hundred
          # megabytes from a CDN that does occasionally stall — and the failure it causes
          # is a bad one to debug: without a retry, a stalled bottle leaves the configure
          # step below reporting a missing dependency, which says nothing about the network
          # and sends the reader looking at CMakeLists.txt instead.
          for attempt in 1 2 3; do
            brew install cmake ninja pkg-config qt@6 libusb flac spdlog googletest dylibbundler && break
            if [[ "${attempt}" == 3 ]]; then
              echo "brew install failed after three attempts" >&2
              exit 1
            fi
            echo "::warning::brew install did not finish on attempt ${attempt}; retrying"
            sleep 15
          done

      - name: Fetch the pinned update bundle
        id: bundled
        shell: bash
        run: |
          set -euo pipefail
          path="$(./tools/fetch-bundled-update.sh \
            --output "${PWD}/build-bundled/update.dddfw")"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix qt@6)/bin:${PATH}"
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

          # The bundled set, when one is pinned. CMake places it inside the built bundle's
          # Contents/Resources, which is where the application looks and where the
          # hand-assembled bundle below takes it from.
          #
          # Expanded as ${bundled[@]+"${bundled[@]}"} rather than "${bundled[@]}": macOS
          # ships bash 3.2, where an empty array under `set -u` is an unbound variable and
          # not an empty expansion. Every other runner in this repository has bash 5, which
          # is why this failed on macOS alone and passed everywhere else.
          bundled=()
          if [[ -n "${{ steps.bundled.outputs.path }}" ]]; then
            bundled=(-DDDD_BUNDLED_UPDATE_FILE="${{ steps.bundled.outputs.path }}")
          fi

          cmake -B build -S ddd-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DDDD_COMMIT="${{ steps.version.outputs.ddd_commit }}" \
            ${bundled[@]+"${bundled[@]}"}
          cmake --build build

      - name: Run the test suite
        shell: bash
        run: |
          # macOS is best-effort for the flake but not for a release asset: a DMG
          # that ships is a DMG whose tests ran.
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure --label-exclude 'hil'

      - name: Assemble the application bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix qt@6)/bin:${PATH}"

          APP="dist/DomesdayDuplicator.app"
          rm -rf dist && mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          # The target is MACOSX_BUNDLE, so the build tree already holds a minimal .app with
          # a CMake-generated Info.plist. The executable is taken out of it and rebundled
          # here rather than that bundle being shipped: the plist below is the one with the
          # release version, the bundle identifier and the icon, and a release asset should
          # not depend on what CMake happens to generate by default.
          cp build/bin/ddd-gui.app/Contents/MacOS/ddd-gui \
            "${APP}/Contents/MacOS/"

          # The bundled update file, if this build carries one. Taken from where the
          # build put it rather than from the download, so that the name and the place are
          # decided once, in CMake, for every platform.
          if [[ -f build/bin/ddd-gui.app/Contents/Resources/update.dddfw ]]; then
            cp build/bin/ddd-gui.app/Contents/Resources/update.dddfw \
              "${APP}/Contents/Resources/"
          fi

          # An .icns built from the PNG set already in the tree, rather than a second copy
          # of the artwork maintained for macOS alone.
          ICONSET=DomesdayDuplicator.iconset
          mkdir -p "${ICONSET}"
          SRC=ddd-gui/src/gui/resources
          cp "${SRC}/icon-16.png"  "${ICONSET}/icon_16x16.png"
          cp "${SRC}/icon-32.png"  "${ICONSET}/icon_16x16@2x.png"
          cp "${SRC}/icon-32.png"  "${ICONSET}/icon_32x32.png"
          cp "${SRC}/icon-64.png"  "${ICONSET}/icon_32x32@2x.png"
          cp "${SRC}/icon-128.png" "${ICONSET}/icon_128x128.png"
          cp "${SRC}/icon-256.png" "${ICONSET}/icon_128x128@2x.png"
          cp "${SRC}/icon-256.png" "${ICONSET}/icon_256x256.png"
          iconutil -c icns "${ICONSET}" -o "${APP}/Contents/Resources/DomesdayDuplicator.icns"

          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Domesday Duplicator</string>
            <key>CFBundleDisplayName</key><string>Domesday Duplicator</string>
            <key>CFBundleExecutable</key><string>ddd-gui</string>
            <key>CFBundleIdentifier</key><string>io.github.simoninns.DddGui</string>
            <key>CFBundleIconFile</key><string>DomesdayDuplicator.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.version }}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

      - name: Bundle the Qt and libFLAC dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix qt@6)/bin:${PATH}"

          # macdeployqt follows Qt and nothing else, so libFLAC, libogg and libusb — which
          # come from Homebrew prefixes that do not exist on a user's machine — would be
          # left as dangling references. This is the failure that builds green and then
          # fails to launch for everyone, so dylibbundler runs afterwards to catch them.
          macdeployqt dist/DomesdayDuplicator.app -verbose=1
          dylibbundler -od -b -x dist/DomesdayDuplicator.app/Contents/MacOS/ddd-gui \
            -d dist/DomesdayDuplicator.app/Contents/libs -p @executable_path/../libs

          # dylibbundler rewrites each Homebrew rpath it finds to the bundle's own
          # libs directory, one install_name_tool call per rpath. A binary carrying
          # more than one of them — /opt/homebrew/lib for libusb and libFLAC, and the
          # keg-only qt prefix for Qt — therefore comes out with the same LC_RPATH
          # twice, and dyld aborts rather than launching it. Whichever prefixes the
          # runner's Homebrew happens to use, the bundle needs each rpath once.
          BIN=dist/DomesdayDuplicator.app/Contents/MacOS/ddd-gui
          while duplicate=$(otool -l "${BIN}" | awk '$1 == "path" { print $2 }' \
                              | sort | uniq -d | head -n 1); [[ -n "${duplicate}" ]]; do
            echo "Removing a duplicate LC_RPATH: ${duplicate}"
            install_name_tool -delete_rpath "${duplicate}" "${BIN}"
          done

          # install_name_tool invalidates the ad-hoc signature dylibbundler left
          # behind, and an unsigned arm64 binary will not run at all.
          codesign --force --preserve-metadata=entitlements,requirements,flags,runtime \
            --sign - "${BIN}"

          echo "== Remaining references to Homebrew prefixes (must be none) =="
          if otool -L dist/DomesdayDuplicator.app/Contents/MacOS/ddd-gui | grep -E '/opt/homebrew|/usr/local/Cellar'; then
            echo "The bundle still references Homebrew paths and would not run on a user's machine" >&2
            exit 1
          fi

      - name: Check the bundled application runs
        shell: bash
        run: |
          set -euo pipefail
          reported=$(dist/DomesdayDuplicator.app/Contents/MacOS/ddd-gui --version)
          echo "Packaged application reports: ${reported}"
          case "${reported}" in
            *unknown*) echo "The packaged application reports an unknown commit" >&2; exit 1 ;;
          esac

          # A pinned set that did not reach the shipped bundle would leave the offline
          # bring-up path broken in exactly the case it exists for.
          if [[ -n "${{ steps.bundled.outputs.path }}" ]]; then
            if [[ ! -f dist/DomesdayDuplicator.app/Contents/Resources/update.dddfw ]]; then
              echo "The pinned update file is not in the application bundle" >&2
              exit 1
            fi
            echo "Bundled update file present"
          fi

      - name: Build the DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/DomesdayDuplicator-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          STAGING=dmg-root
          rm -rf "${STAGING}" && mkdir -p "${STAGING}"
          cp -R dist/DomesdayDuplicator.app "${STAGING}/"
          ln -s /Applications "${STAGING}/Applications"

          # hdiutil intermittently fails to attach on hosted runners under contention.
          # Retry rather than fail the build for something that is not a defect.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Domesday Duplicator" -srcfolder "${STAGING}" \
                 -ov -format UDZO "${DMG}"; then
              hdiutil verify "${DMG}"
              exit 0
            fi
            echo "hdiutil create failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 10))
          done
          echo "hdiutil create failed after 3 attempts" >&2
          exit 1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.dmg
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
