# Linux Flatpak for the capture application.
#
# Reusable, following decode-orc: build.yml calls it on every non-PR push so the installer
# is testable per branch, and release-gui.yml calls it again on a gui-v* tag.
#
# This packages ddd-gui, which ships under an application ID of its own, so a machine with
# the Flatpak of the application it replaced installed keeps it until somebody removes it
# deliberately.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Package Linux Flatpak

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded Flatpak artifact
        required: false
        default: DomesdayDuplicator-linux-flatpak
        type: string
      retention_days:
        description: Artifact retention in days
        required: false
        default: 30
        type: number

jobs:
  package:
    name: Flatpak
    runs-on: ubuntu-latest
    # A healthy run finishes in minutes; the default 6h job timeout only kicks in once
    # everything else downstream (DMG, MSI, the release gate) has been waiting for hours.
    # 30 covers a slow-but-real Flathub pull without masking a genuine stall.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # A tag names itself; anything else names its commit. Neither may end up as
          # "unknown", which fails the release gate.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#gui-v}"
          else
            version="git-${GITHUB_SHA:0:8}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Two stamps now, because the application reports two things and they
          # answer different questions (ddd-gui/src/capture/version.h). The
          # release version is only known on a tag — nothing else is a numbered
          # release, and guessing would put a number on a binary no release
          # carries. The commit is always known.
          if [[ "${GITHUB_REF}" == refs/tags/gui-v* ]]; then
            echo "ddd_version=${GITHUB_REF_NAME#gui-v}" >> "$GITHUB_OUTPUT"
          else
            echo "ddd_version=unknown" >> "$GITHUB_OUTPUT"
          fi
          echo "ddd_commit=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Install flatpak-builder
        shell: bash
        # OSTree pulls have no built-in timeout of their own: a connection that stalls
        # mid-transfer (a flaky Flathub CDN edge, say) just sits forever rather than
        # failing. Bound it here so a stall surfaces as a fast, retryable failure.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          # Read from the manifest rather than repeating it here. Two copies of a runtime
          # version drift, and the failure that follows is a build against a runtime nobody
          # meant to use.
          MANIFEST=ddd-gui/packaging/flatpak/io.github.simoninns.DddGui.yml
          RUNTIME_VERSION="$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${MANIFEST}")"
          [[ -n "${RUNTIME_VERSION}" ]] || { echo "no runtime-version in ${MANIFEST}" >&2; exit 1; }
          echo "Installing the KDE runtime and SDK ${RUNTIME_VERSION}"
          sudo flatpak install -y flathub \
            "org.kde.Platform//${RUNTIME_VERSION}" "org.kde.Sdk//${RUNTIME_VERSION}"

      - name: Validate desktop and AppStream metadata
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate ddd-gui/packaging/assets/io.github.simoninns.DddGui.desktop
          # A malformed metainfo file is rejected at Flathub review rather than at build
          # time, so it is checked here where the feedback is immediate.
          appstreamcli validate --no-net ddd-gui/packaging/assets/io.github.simoninns.DddGui.metainfo.xml

      - name: Fetch the pinned update bundle
        id: bundled
        shell: bash
        run: |
          set -euo pipefail
          # Into the checkout, because flatpak-builder's source is this directory and the
          # build itself has no network. An unpinned tree writes nothing and the flag is
          # removed by the stamping step below; that is a legitimate build, not a failure.
          #
          # This step has to come *before* the stamping step: `${{ steps.bundled.outputs.path }}`
          # is evaluated when the step reading it begins, so a fetch placed after it would
          # hand the stamping step an empty string, delete the manifest's bundled-update
          # line, and then leave the install check hunting for a file the manifest never
          # asked to be installed.
          path="$(./tools/fetch-bundled-update.sh \
            --output ddd-gui/packaging/bundled/update.dddfw)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the manifest and the AppStream release list
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=ddd-gui/packaging/flatpak/io.github.simoninns.DddGui.yml
          sed -i "s/@DDD_VERSION@/${{ steps.version.outputs.ddd_version }}/" "${MANIFEST}"
          sed -i "s/@DDD_COMMIT@/${{ steps.version.outputs.ddd_commit }}/" "${MANIFEST}"
          grep -q "@DDD_VERSION@" "${MANIFEST}" && { echo "version placeholder not substituted" >&2; exit 1; }
          grep -q "@DDD_COMMIT@" "${MANIFEST}" && { echo "commit placeholder not substituted" >&2; exit 1; }

          # The update bundle, if one was fetched. The path is the one the file has
          # *inside* the sandbox: the module's source is the repository root, mounted at
          # /run/build/ddd-gui, and subdir: ddd-gui is what the build runs in.
          if [[ -n "${{ steps.bundled.outputs.path }}" ]]; then
            sed -i "s|@DDD_BUNDLED_UPDATE_FILE@|/run/build/ddd-gui/${{ steps.bundled.outputs.path }}|" \
              "${MANIFEST}"
          else
            sed -i "/@DDD_BUNDLED_UPDATE_FILE@/d" "${MANIFEST}"
          fi
          if grep -q "@DDD_BUNDLED_UPDATE_FILE@" "${MANIFEST}"; then
            echo "bundled-update placeholder not resolved" >&2
            exit 1
          fi

          # Rewrite the <releases> list from the tag rather than maintaining it by hand,
          # which is how a version history goes stale.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            METAINFO=ddd-gui/packaging/assets/io.github.simoninns.DddGui.metainfo.xml
            python3 - "$METAINFO" "${{ steps.version.outputs.version }}" "$(date -u +%Y-%m-%d)" <<'PY'
          import re, sys
          path, version, date = sys.argv[1:4]
          text = open(path, encoding="utf-8").read()
          entry = f'    <release version="{version}" date="{date}">\n      <description>\n        <p>Release {version}.</p>\n      </description>\n    </release>\n'
          text = re.sub(r"  <releases>.*?</releases>\n", f"  <releases>\n{entry}  </releases>\n", text, flags=re.S)
          open(path, "w", encoding="utf-8").write(text)
          PY
          fi

      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('ddd-gui/packaging/flatpak/*.yml') }}
          restore-keys: flatpak-builder-

      - name: Build
        run: |
          sudo flatpak-builder --disable-rofiles-fuse --repo=repo --force-clean \
            build-dir ddd-gui/packaging/flatpak/io.github.simoninns.DddGui.yml

      - name: Export a single-file bundle
        run: |
          mkdir -p dist
          sudo flatpak build-bundle repo \
            "dist/DomesdayDuplicator-${{ steps.version.outputs.version }}.flatpak" \
            io.github.simoninns.DddGui
          sudo chown "$(id -u):$(id -g)" dist/*.flatpak

      - name: Install the bundle and check it runs
        run: |
          # Installing from the bundle is the part that catches a manifest which builds but
          # produces something unlaunchable — a missing runtime dependency, a broken
          # desktop file, an application ID mismatch. Checking the binary answers
          # --version also proves the commit stamp survived into the packaged build.
          flatpak install --user -y --bundle "dist/DomesdayDuplicator-${{ steps.version.outputs.version }}.flatpak"

          # flatpak run keeps its per-instance state under XDG_RUNTIME_DIR, and a hosted
          # runner has no logind session to create /run/user/<uid>. Without a usable one
          # the launch fails with "Unable to allocate instance id" before the application
          # is reached, which reads as a broken package rather than a missing directory.
          # Private, 0700 and inside the job's temporary space, as the specification asks.
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR

          # --version goes through QCommandLineParser, which needs the QApplication that
          # main() constructs first, so even this much of the application wants a platform
          # plugin — and a hosted runner has no display for it to find. offscreen is the
          # same plugin the test steps use, passed with --env because the sandbox does not
          # owe the host environment anything.
          reported=$(flatpak run --env=QT_QPA_PLATFORM=offscreen \
            --command=ddd-gui io.github.simoninns.DddGui --version)
          echo "Packaged application reports: ${reported}"
          case "${reported}" in
            *unknown*) echo "The packaged application reports an unknown version" >&2; exit 1 ;;
          esac

          # A pinned set that did not survive into the installed application is the exact
          # failure this whole path exists to prevent — a build that looks complete and
          # then cannot bring a board up on the machine that has no network. Checked
          # inside the sandbox, at the path the application searches.
          if [[ -n "${{ steps.bundled.outputs.path }}" ]]; then
            flatpak run --command=test io.github.simoninns.DddGui \
              -f /app/share/io.github.simoninns.DddGui/update.dddfw || {
              echo "The pinned update file is not in the installed application" >&2
              exit 1
            }
            echo "Bundled update file present"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*.flatpak
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
