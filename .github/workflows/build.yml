# The build that runs on every commit.
#
# Replaces the three per-submodule workflows that came in with the monorepo, one of which
# had never worked because it pointed at a directory that did not exist. Those files
# lived at fx3/.github and ddd-gui/.github, where GitHub does not look for them; they are
# deleted rather than left as decoration.
#
# One build path per component, because Nix is the only supported development environment
# (maintainer, 2026-08-15). The capture application is built and tested by its Nix package;
# its two quality gates run in the development shell, so CI analyses with the same pinned
# clang-tools a developer has. The native toolchains survive only inside the packaging
# workflows, where they are unavoidable — Nix cannot produce an MSI or a DMG — and those
# jobs build, install and launch what they package, which is the platform coverage the
# deleted native jobs used to provide.
#
# **Every push builds and packages everything**, on every branch (maintainer, 2026-08-13).
# An earlier revision path-filtered branch builds so that a docs-only change skipped the
# firmware; that saves CI minutes and costs the thing this phase exists for, which is
# knowing the whole chain still works. The installers in particular are only proven by
# being built, so they are built on every push rather than only on the way to a release.
#
# Path filtering survives for pull requests alone, where the same commits have already had
# a full run from their branch push and the filtered run is the second opinion, not the
# first.
#
# Tags are deliberately absent from the triggers below: release-gui.yml and
# release-firmware.yml handle those, and they call the same reusable packaging workflows.
# Listing tags here as well would build every installer twice for each release.
#
# The FPGA bitstream is absent for a different reason: it needs Quartus, which is unfree and
# GB-scale, so it is built by bitstream.yml on gateware changes rather than on every push.
# What runs here for the gateware is the free-tool tier — lint, style, simulation,
# constraints, version and provenance — and that is deliberate: a contributor must never
# need an unfree download to find out whether their change is sound.
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled: this workflow never builds a release, so nothing it
  # produces is worth finishing once a newer commit has arrived on the same ref.
  cancel-in-progress: true

jobs:
  # Path filtering as a job rather than an `on: paths:` filter, because `on: paths:` cannot
  # be made conditional and this filter applies to pull requests only.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # No dash in the name: GitHub expression syntax would read `outputs.ddd-gui` as a
      # subtraction.
      dddgui: ${{ steps.decide.outputs.dddgui }}
      fx3: ${{ steps.decide.outputs.fx3 }}
      fpga: ${{ steps.decide.outputs.fpga }}
      docs: ${{ steps.decide.outputs.docs }}
      everything: ${{ steps.decide.outputs.everything }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - flake.nix
              - flake.lock
              - nix/**
              - tools/**
              - .github/workflows/**
            dddgui:
              - *shared
              - ddd-gui/**
            fx3:
              - *shared
              - fx3/**
            fpga:
              - *shared
              - fpga/**
            docs:
              - *shared
              - docs/**

      # Every push and every manual dispatch builds everything, on every branch. Only pull
      # requests are filtered, and only because the branch push for the same commits has
      # already run the complete set — without that, a filtered run would be the only
      # evidence a change ever produced, which is how a component quietly stops building.
      - name: Decide what to build
        id: decide
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "Pull request: building only what changed"
            {
              echo "dddgui=${{ steps.filter.outputs.dddgui }}"
              echo "fx3=${{ steps.filter.outputs.fx3 }}"
              echo "fpga=${{ steps.filter.outputs.fpga }}"
              echo "docs=${{ steps.filter.outputs.docs }}"
              echo "everything=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Building everything for ${GITHUB_REF} (${GITHUB_EVENT_NAME})"
            for component in dddgui fx3 fpga docs; do
              echo "${component}=true" >> "$GITHUB_OUTPUT"
            done
            echo "everything=true" >> "$GITHUB_OUTPUT"
          fi

  # Per component rather than one `nix flake check`, so that the path filters mean
  # something: a docs-only change must not rebuild the FX3 firmware, and `nix flake check`
  # builds every check there is. The full check still runs — see the `nix-flake-check` job —
  # on the refs where completeness is the point.
  #
  # Each package's own checkPhase runs its ctest suite, so building a component is also
  # testing it (T1-T4). The gateware has no package CI can build, so its lint, style,
  # simulation, provenance and version checks are named explicitly.
  nix:
    name: Nix — ${{ matrix.component }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ddd-gui
            enabled: dddgui
            attrs: .#ddd-gui
          - component: fx3
            enabled: fx3
            attrs: .#fx3-firmware .#fx3-programmer
          - component: fpga
            enabled: fpga
            # Every gateware check, named individually — there is no fpga package for the
            # matrix to build, so anything absent from this line is not covered on a
            # path-filtered pull request. Keep it in step with the `fpga-*` attributes in
            # flake.nix.
            attrs: .#checks.x86_64-linux.fpga-lint .#checks.x86_64-linux.fpga-style .#checks.x86_64-linux.fpga-sim .#checks.x86_64-linux.fpga-provenance .#checks.x86_64-linux.fpga-version
          - component: docs
            enabled: docs
            attrs: .#docs-site

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.enabled] == 'true'

      - name: Install Nix
        if: needs.changes.outputs[matrix.enabled] == 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Use the Magic Nix Cache
        if: needs.changes.outputs[matrix.enabled] == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        if: needs.changes.outputs[matrix.enabled] == 'true'
        run: nix build --print-build-logs ${{ matrix.attrs }}

      - name: Collect the artefacts
        if: needs.changes.outputs[matrix.enabled] == 'true' && matrix.component == 'fx3'
        run: |
          set -euo pipefail
          mkdir -p artifacts/fx3-firmware artifacts/fx3-programmer

          nix build .#fx3-firmware --out-link result-firmware
          cp -rL result-firmware/* artifacts/fx3-firmware/

          nix build .#fx3-programmer --out-link result-programmer
          cp -rL result-programmer/bin/* artifacts/fx3-programmer/

          chmod -R u+w artifacts

      - name: Upload
        if: needs.changes.outputs[matrix.enabled] == 'true' && matrix.component == 'fx3'
        uses: actions/upload-artifact@v4
        with:
          # The short SHA in the name is what makes a build from any commit fetchable
          # without re-running CI. This is not the release archive — GitHub expires
          # these, which is why releases attach their own copies.
          name: fx3-artifacts-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  # The update bundle, assembled on every commit that touches the firmware or the tooling.
  #
  # Two things happen here and they are not the same thing. The check proves the packaging
  # works — entry order, signature, digests, byte-for-byte reproducibility — against a
  # synthetic payload and with stock tar, minisign and sha256sum. The step after it then
  # packages *this commit's real firmware* into a development bundle and uploads it, so
  # every commit has an artefact somebody can take to bench hardware and install with the
  # same code path a release uses.
  #
  # It is signed with the committed development key, which proves the bundle is well
  # formed and proves nothing at all about where it came from. That is the whole point of
  # the channel being in the manifest: a release build of the application refuses it.
  # Nothing here writes to a device (AGENTS.md §4) — CI assembles a file, and installing
  # it stays a deliberate human act.
  update-bundle:
    name: Update bundle
    needs: changes
    if: needs.changes.outputs.fx3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check the bundle tooling
        run: nix build --print-build-logs .#checks.x86_64-linux.update-bundle

      - name: Assemble a development bundle from this commit's firmware
        run: |
          set -euo pipefail
          nix build .#fx3-firmware --out-link result-firmware

          # --inputs-from . takes minisign from this flake's locked nixpkgs rather than
          # from whatever the registry points at today, so the tool that signs in CI is
          # pinned like everything else.
          nix shell --inputs-from . nixpkgs#minisign --command \
            ./tools/dev-bundle.sh \
              --output "artifacts/domesday-duplicator-update-${GITHUB_SHA:0:8}-dev.dddfw"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: update-bundle-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  # The whole-tree check, on the refs where a complete result matters rather than on every
  # push to every branch. It excludes `bitstream`: Quartus is unfree, GB-scale and
  # x86_64-linux only, so it is built by bitstream.yml instead.
  nix-flake-check:
    name: nix flake check
    needs: changes
    if: needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --print-build-logs

  # The two quality gates, run in the development shell so that CI and a developer's
  # machine are analysing with the *same* clang-format and clang-tidy. That is not a
  # convenience: these gates are version-sensitive, and this project has already spent a
  # day on a CI failure no developer could reproduce because the runner's clang-tidy knew
  # a check the pinned one did not. A gate that can disagree with the shell it is meant to
  # enforce is a gate that reports on the toolchain rather than on the code.
  #
  # It compiles the tests as well as the application, because clang-tidy only sees what is
  # compiled and the last three findings were all in test code. It runs no tests: the Nix
  # build above already runs the suite against the same commit.
  quality-gates:
    name: Quality gates
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.dddgui == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Both gates are attached to the build: clang-format as its own target, clang-tidy
      # through CXX_CLANG_TIDY, so compiling is what runs them.
      - name: clang-format and clang-tidy
        run: |
          nix develop -c cmake -B build -S ddd-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DDDD_VERSION="${GITHUB_SHA:0:8}"
          nix develop -c cmake --build build

  # The installers are built on every push, on every branch, and each packaging workflow
  # installs what it built and runs it. That is the end-to-end validation: a Flatpak, a DMG
  # or an MSI is only proven by being built and installed, and finding out at release time
  # is finding out too late. release-gui.yml calls these same workflows from the tag.
  #
  # Pull requests skip them, and only because the branch push for the same commits has
  # already built them.
  package-flatpak:
    name: Package
    needs: [changes, quality-gates]
    if: github.event_name != 'pull_request' && needs.changes.outputs.dddgui == 'true'
    uses: ./.github/workflows/package-flatpak.yml

  package-macos:
    name: Package
    needs: [changes, quality-gates]
    if: github.event_name != 'pull_request' && needs.changes.outputs.dddgui == 'true'
    uses: ./.github/workflows/package-macos.yml

  package-windows:
    name: Package
    needs: [changes, quality-gates]
    if: github.event_name != 'pull_request' && needs.changes.outputs.dddgui == 'true'
    uses: ./.github/workflows/package-windows.yml
