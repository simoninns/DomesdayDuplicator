# The firmware and gateware release stream (P7-8 … P7-11, P7-18; Phase 6 of the
# device-update plan).
#
# Triggered by fw-v* tags only, and it builds no GUI installers — the capture application
# releases separately under gui-v*.
#
# **Everything in a release is built by CI from the tagged commit.** That is the change this
# workflow carries: the bitstream used to be built on the maintainer's machine and attached
# by hand, and this file used to publish a draft so that a firmware release could not go out
# with the gateware quietly missing. Both are gone. bitstream.yml compiles Quartus from the
# tag, this workflow assembles and signs the update bundle from those exact bytes, and the
# maintainer's release act is: tag.
#
# What a complete fw-v* release carries:
#
#   domesday-duplicator-update-<ver>.dddfw          CI — the signed device update bundle
#   domesday-duplicator-provisioning-<ver>.dddfw    CI — the signed board bring-up set:
#                                                   firmware plus the gateware as JTAG
#                                                   vectors, which is what a board with no
#                                                   working gateware is brought up with
#   firmware.img / firmware.elf / firmware.map      CI (nix build .#fx3-firmware)
#   fx3-programmer-<ver>-linux-x64                  CI (nix build .#fx3-programmer)
#   DomesdayDuplicatorProvisioning.jic              CI (nix build .#bitstream) — bench
#                                                   provisioning of a new board, both images
#   DomesdayDuplicatorProvisioning.svf              CI — the same, as JTAG vectors: what
#                                                   ddd-jtag and the bring-up set play
#   DomesdayDuplicator_auto.rpd                     CI — the raw application image; also
#                                                   inside the bundle, published for
#                                                   inspection
#   DomesdayDuplicatorFactory.sof / .map / boot-block.bin
#                                                   CI — the rest of the provisioning set
#   bitstream-provenance.txt                        CI — Quartus version, digests, both
#                                                   release and canonical
#   SHA256SUMS / PROVENANCE.txt                     CI
#
# The two .dddfw files are the only assets the application installs from, and the only
# signed ones: each manifest carries every payload's SHA-256 and is signed with the release
# key, so the application can prove what it is about to write before it writes it. They
# differ in what they carry and in who installs them — the update bundle goes to a working
# device over USB, the provisioning set to a board that has no working gateware, over JTAG
# — and not in their format, their key or their verifier. The other assets are for bench
# work and for inspection, and SHA256SUMS covers them.
#
# Key custody: the release secret key is the repository secret UPDATE_SIGNING_KEY, generated
# with `minisign -G -W` (no passphrase, because a passphrase in a second secret protects
# nothing that the first secret does not already expose). Its public half is committed at
# tools/keys/release.pub and compiled into the application, so a bundle this workflow signs
# is a bundle the application accepts, and nothing else is. Rotation is a matching pair of
# commits: new public key here, new secret in the repository settings, and release notes
# saying so — older applications keep verifying older bundles against the older key.
#
# Nothing here writes to a device (AGENTS.md §4).
#
# SPDX-License-Identifier: GPL-3.0-or-later

name: Release (firmware and gateware)

on:
  push:
    tags: ['fw-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The fw-v* tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Quartus, from the tag. Called rather than repeated: the caching, the disk preparation
  # and the licence position all live in bitstream.yml, and a release that built the
  # gateware its own way would be a second definition of what a bitstream is.
  bitstream:
    name: Bitstream
    uses: ./.github/workflows/bitstream.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      artifact_name: bitstream-release
      retention_days: 90

  publish:
    name: Build and publish
    needs: bitstream
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Use the Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build the firmware and the programmer from the tag
        run: |
          nix build --print-build-logs .#fx3-firmware --out-link result-firmware
          nix build --print-build-logs .#fx3-programmer --out-link result-programmer

      - name: Fetch the bitstreams built from the tag
        uses: actions/download-artifact@v4
        with:
          pattern: bitstream-release-*
          path: bitstream
          merge-multiple: true

      - name: Collect the assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#fw-v}"

          mkdir -p release-artifacts
          cp -L result-firmware/*.img result-firmware/*.elf result-firmware/*.map release-artifacts/ 2>/dev/null || \
            cp -rL result-firmware/* release-artifacts/
          cp -L result-programmer/bin/fx3-programmer "release-artifacts/fx3-programmer-${VERSION}-linux-x64"

          # The gateware assets, flattened out of the layout the bitstream build publishes.
          # Named one by one rather than copied wholesale: the compilation reports and the
          # .cdf files are useful in the workflow artefact and are noise on a release page.
          cp -L bitstream/provisioning/DomesdayDuplicatorProvisioning.jic \
                bitstream/provisioning/DomesdayDuplicatorProvisioning.map \
                bitstream/provisioning/boot-block.bin \
                bitstream/application/DomesdayDuplicator_auto.rpd \
                bitstream/factory/DomesdayDuplicatorFactory.sof \
                bitstream/factory/DomesdayDuplicatorFactory_auto.rpd \
                bitstream/factory/DomesdayDuplicatorFactoryConfigure.svf \
                bitstream/bitstream-provenance.txt \
                release-artifacts/

          chmod +w release-artifacts/*
          ls -la release-artifacts

      # P7-9: an artefact that reports "unknown" is untraceable, which is the whole reason
      # this gate exists. The version reaches the USB product descriptor (D4), so it is in
      # the image itself and can be checked without a device.
      #
      # Seven characters, not eight: a Nix build stamps `self.shortRev`, which is git's
      # seven. The application compares commit stamps on their common prefix for exactly
      # this reason (ddd-gui/src/capture/firmware_version.h), so a seven-character identity
      # in the manifest matches an eight-character one on a device and the other way round.
      - name: Check the firmware carries the commit
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMG=$(ls release-artifacts/*.img | head -1)

          if grep -aq "unknown" "${IMG}"; then
            echo "The firmware image contains the string 'unknown' — check the version stamping" >&2
            exit 1
          fi
          if ! grep -aq "${SHORT_SHA}" "${IMG}"; then
            echo "The firmware image does not carry the commit ${SHORT_SHA}" >&2
            exit 1
          fi
          echo "Firmware image carries commit ${SHORT_SHA}"

      # The bitstream carries its commit in its own provenance record, which the build
      # already refuses to produce with an unknown commit. This is the second half: that
      # the commit it names is *this tag's*, and not an artefact fetched from elsewhere.
      - name: Check the bitstream was built from the tag
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if ! grep -q "commit  *${SHORT_SHA}" release-artifacts/bitstream-provenance.txt; then
            echo "The bitstream provenance does not name ${SHORT_SHA}:" >&2
            grep -m1 "commit" release-artifacts/bitstream-provenance.txt >&2
            exit 1
          fi
          echo "Bitstream built from commit ${SHORT_SHA}"

      # The one asset a device installs by itself, and the point in the chain where a right
      # manifest could be married to a wrong payload. make-update-bundle.sh re-reads the
      # finished file with stock tar, minisign and sha256sum before it exits, so a bundle
      # that assembles is a bundle that has already been taken apart and checked once.
      - name: Assemble and sign the update bundle
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#fw-v}"
          IDENTITY="${GITHUB_SHA:0:7}"

          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "The tag ${TAG} does not give a dotted numeric version" >&2
            exit 1
          fi

          if [[ -z "${UPDATE_SIGNING_KEY}" ]]; then
            echo "The repository secret UPDATE_SIGNING_KEY is not set." >&2
            echo "A release bundle signed with anything else is a release bundle the" >&2
            echo "application will refuse, so this is a failure and not a warning." >&2
            exit 1
          fi
          if [[ ! -f tools/keys/release.pub ]]; then
            echo "tools/keys/release.pub is missing: this commit pins no release key," >&2
            echo "so an application built from it could not verify what CI signed." >&2
            exit 1
          fi

          # The secret never touches the working tree — a file under $RUNNER_TEMP is off
          # the checkout, so nothing can archive or upload it by accident.
          key_file="${RUNNER_TEMP}/release.key"
          printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          # The compatibility policy is a tracked decision; the interface versions are facts
          # read out of the sources that implement them, so the manifest cannot claim a
          # protocol the firmware does not speak or a register map the gateware does not
          # implement.
          # shellcheck source=/dev/null
          source tools/release/compatibility.env

          PROTOCOL_VERSION=$(sed -n 's/^#define PROTOCOL_VERSION_H[[:space:]]*0x0*\([0-9A-Fa-f]\+\).*/\1/p' \
            fx3/firmware/src/usb-descriptor.c | head -1)
          MAP_VERSION=$(sed -n "s/.*localparam \[7:0\] MapVersion = 8'h0*\([0-9A-Fa-f]\+\).*/\1/p" \
            fpga/common/spiRegisters.v | head -1)
          EPCS_LAYOUT_VERSION=$(sed -n 's/^LAYOUT_VERSION = \([0-9]\+\).*/\1/p' \
            fpga/make-boot-block.py | head -1)

          # The commit the tracked legacy images were built from, read out of the
          # provenance record beside them rather than typed here — the same rule the
          # interface versions above follow, for the same reason.
          LEGACY_COMMIT=$(sed -n 's/^| Pinned ref | \*\*`\([0-9a-f]\{7,\}\)`\*\*.*/\1/p' \
            legacy/README.md | head -1)

          for name in PROTOCOL_VERSION MAP_VERSION EPCS_LAYOUT_VERSION LEGACY_COMMIT; do
            if [[ -z "${!name}" ]]; then
              echo "Could not read ${name} out of the sources" >&2
              exit 1
            fi
          done

          # And the images themselves, against the digests their README records. They are
          # frozen binaries that nothing rebuilds, so the one thing worth checking before
          # they are signed into a release is that they are still the bytes somebody
          # wrote that provenance about.
          for image in firmware.img gateware.rpd gateware.sof gateware.cof; do
            recorded=$(sed -n "s/^| \`${image}\` | [0-9,]* | \`\([0-9a-f]\{64\}\)\` |.*/\1/p" \
              legacy/README.md | head -1)
            actual=$(sha256sum "legacy/${image}" | cut -d' ' -f1)
            if [[ "${recorded}" != "${actual}" ]]; then
              echo "legacy/${image} is ${actual}, and legacy/README.md records ${recorded}" >&2
              exit 1
            fi
          done
          echo "protocol ${PROTOCOL_VERSION}, register map ${MAP_VERSION}, EPCS layout ${EPCS_LAYOUT_VERSION}"

          nix shell --inputs-from . nixpkgs#minisign --command \
            ./tools/make-update-bundle.sh \
              --output "release-artifacts/domesday-duplicator-update-${VERSION}.dddfw" \
              --version "${VERSION}" \
              --commit "${IDENTITY}" \
              --channel release \
              --secret-key "${key_file}" \
              --public-key tools/keys/release.pub \
              --notes "Domesday Duplicator firmware and gateware ${TAG}." \
              --firmware release-artifacts/firmware.img \
              --firmware-identity "${IDENTITY}" \
              --firmware-interface-version "$((16#${PROTOCOL_VERSION}))" \
              --gateware release-artifacts/DomesdayDuplicator_auto.rpd \
              --gateware-identity "${IDENTITY}" \
              --gateware-interface-version "$((16#${MAP_VERSION}))" \
              --minimum-application-version "${MINIMUM_APPLICATION_VERSION}" \
              --minimum-register-map-version "$((16#${MAP_VERSION}))" \
              --epcs-layout-version "${EPCS_LAYOUT_VERSION}"

          # The provisioning set: the same firmware, the vectors that configure the
          # factory image into an FPGA, and that image as raw flash bytes. It is what
          # brings a board up that has no working gateware to receive an ordinary update
          # through — a newly built unit, or one running the original firmware — and the
          # capture application's installers pin and bundle it so that a first bring-up
          # needs no network.
          #
          # The vectors write nothing. They give the board a flash bridge, and the
          # firmware then writes the image through it, over USB, exactly as it writes an
          # ordinary gateware update. (The flash-writing .svf this used to carry cannot be
          # played outside Quartus: it drives Altera's serial flash loader and carries no
          # configuration of its own. TESTING.md, B-V1.)
          #
          # A second bundle rather than more components in the first, and deliberately:
          # every user of the ordinary update path would carry 1.7 MB for nothing. One
          # format, one key, one verifier; two files, because they are installed by
          # different people at different times.
          nix shell --inputs-from . nixpkgs#minisign --command \
            ./tools/make-update-bundle.sh \
              --output "release-artifacts/domesday-duplicator-provisioning-${VERSION}.dddfw" \
              --version "${VERSION}" \
              --commit "${IDENTITY}" \
              --channel release \
              --secret-key "${key_file}" \
              --public-key tools/keys/release.pub \
              --notes "Domesday Duplicator board bring-up set ${TAG}." \
              --firmware release-artifacts/firmware.img \
              --firmware-identity "${IDENTITY}" \
              --firmware-interface-version "$((16#${PROTOCOL_VERSION}))" \
              --provisioning release-artifacts/DomesdayDuplicatorFactoryConfigure.svf \
              --provisioning-identity "${IDENTITY}" \
              --provisioning-interface-version "$((16#${MAP_VERSION}))" \
              --factory-gateware release-artifacts/DomesdayDuplicatorFactory_auto.rpd \
              --factory-gateware-identity "${IDENTITY}" \
              --factory-gateware-interface-version "$((16#${MAP_VERSION}))" \
              --minimum-application-version "${MINIMUM_APPLICATION_VERSION}" \
              --minimum-register-map-version "$((16#${MAP_VERSION}))" \
              --epcs-layout-version "${EPCS_LAYOUT_VERSION}"

          # The legacy rollback set, assembled from the images tracked in legacy/ and
          # from nothing that is built here. Those two files are frozen — generated once
          # from the pinned ref bb65470 and committed, with their provenance in
          # legacy/README.md — so this step only signs and packages what is already in
          # the tree. No workflow ever checks out the historical tree.
          #
          # The identities are the pinned commit rather than this release's, because that
          # is what the images will report once they are running: a manifest that promised
          # this release's commit would be promising something the payload cannot say.
          # The interface versions are 0 for the same reason — the original firmware
          # advertises no protocol version at all, and claiming one for it would be
          # claiming a capability it does not have.
          nix shell --inputs-from . nixpkgs#minisign --command \
            ./tools/make-update-bundle.sh \
              --output "release-artifacts/domesday-duplicator-legacy-rollback-${VERSION}.dddfw" \
              --version "${VERSION}" \
              --commit "${IDENTITY}" \
              --channel release \
              --purpose rollback \
              --secret-key "${key_file}" \
              --public-key tools/keys/release.pub \
              --notes "Returns a unit to the original Duplicator firmware and gateware." \
              --firmware legacy/firmware.img \
              --firmware-identity "${LEGACY_COMMIT}" \
              --firmware-interface-version 0 \
              --factory-gateware legacy/gateware.rpd \
              --factory-gateware-identity "${LEGACY_COMMIT}" \
              --factory-gateware-interface-version 0 \
              --minimum-application-version "${MINIMUM_APPLICATION_VERSION}" \
              --minimum-register-map-version 0 \
              --epcs-layout-version "${EPCS_LAYOUT_VERSION}"

          rm -f "${key_file}"

      # An independent read of the finished bundle, against the *committed* public key —
      # the same bytes the application compiles in. The assembler already verified its own
      # output, which is the check that catches a mistake; this is the check that catches
      # the wrong key being used at all, and it costs a second.
      - name: Verify the bundles against the pinned public key
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#fw-v}"

          # Both signed bundles, through one loop: the provisioning set is installed by
          # the same application with the same key policy, so a gate that only covered
          # the update bundle would leave the file a bare board depends on unchecked.
          for name in update provisioning legacy-rollback; do
            BUNDLE="release-artifacts/domesday-duplicator-${name}-${VERSION}.dddfw"

            work=$(mktemp -d)
            tar --extract --file "${BUNDLE}" --directory "${work}"

            nix shell --inputs-from . nixpkgs#minisign --command \
              minisign -Vm "${work}/manifest.json" -p tools/keys/release.pub \
                       -x "${work}/manifest.minisig"

            grep -q '"channel": "release"' "${work}/manifest.json" || {
              echo "${BUNDLE} does not declare the release channel" >&2
              exit 1
            }

            echo "### ${name} bundle" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "${work}/manifest.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

          # And the one property that distinguishes the two, checked rather than assumed:
          # a provisioning set carries JTAG vectors, and an update bundle must not — it
          # would be several megabytes of payload nothing on the ordinary path plays.
          PROV="release-artifacts/domesday-duplicator-provisioning-${VERSION}.dddfw"
          UPD="release-artifacts/domesday-duplicator-update-${VERSION}.dddfw"
          tar --list --file "${PROV}" | grep -q '^gateware-factory.rpd$' || {
            echo "The provisioning set carries no factory image" >&2
            exit 1
          }
          tar --list --file "${PROV}" | grep -q '^gateware-provisioning.svf$' || {
            echo "The provisioning set carries no JTAG vectors" >&2
            exit 1
          }
          if tar --list --file "${UPD}" | grep -q 'provisioning'; then
            echo "The update bundle carries provisioning vectors, which it must not" >&2
            exit 1
          fi

      - name: Generate SHA256SUMS and PROVENANCE.txt
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cd release-artifacts

          sha256sum * > SHA256SUMS

          NIXPKGS_REV=$(python3 -c "import json;print(json.load(open('../flake.lock'))['nodes']['nixpkgs']['locked']['rev'])")
          QUARTUS=$(sed -n 's/^  quartus  *//p' bitstream-provenance.txt | head -1)

          cat > PROVENANCE.txt <<EOF
          Domesday Duplicator — firmware and gateware release ${TAG}

          Source commit:      ${GITHUB_SHA}
          Tag:                ${TAG}
          Built by:           ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          flake.lock nixpkgs: ${NIXPKGS_REV}

          Toolchains
            FX3 firmware:   arm-none-eabi-gcc from the pinned nixpkgs, via nix build .#fx3-firmware
            FX3 programmer: the same pin, via nix build .#fx3-programmer
            FPGA gateware:  ${QUARTUS}, via nix build .#bitstream on a GitHub-hosted runner

          Every artefact in this release was built by CI from the tagged commit. No binary
          here was built on a maintainer's machine, and nothing was attached by hand.

          The update bundle
            domesday-duplicator-update-*.dddfw is the file the capture application installs.
            Its manifest carries the SHA-256 of every payload and is signed with the project
            release key; the matching public key is committed at tools/keys/release.pub and
            compiled into the application, which accepts nothing else. The application
            re-checks every digest before it writes, and the device re-checks them again by
            reading back what it wrote.

          The provisioning set
            domesday-duplicator-provisioning-*.dddfw is the same format, signed with the same
            key, carrying the firmware and the gateware as JTAG vectors. It is what the
            capture application's bring-up wizard uses on a board that has no working
            gateware to receive an ordinary update through — a newly built unit, or one still
            running the original Duplicator firmware. Packaged builds of the application
            bundle it by digest, so a first bring-up needs no network.

          Reproducing this release
            The gateware is byte-identical across rebuilds of the same commit on the same
            Quartus, so bitstream-provenance.txt's canonical digests can be checked against
            a rebuild: nix build .#bitstream, then fpga/bitstream-provenance.py. The
            scheduled reproducibility audit does exactly that against this release, and
            fails loudly if a digest has drifted. The .sof files carry a compile timestamp,
            which is why they have a canonical digest as well as a release one.

          Notes
            This release contains firmware and gateware only. The capture application is
            released separately under gui-v* tags.
          EOF

          cat PROVENANCE.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Firmware and gateware ${{ github.event.inputs.tag || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            FX3 firmware, FPGA gateware and the FX3 programmer for the Domesday Duplicator.

            **Updating an existing Duplicator**: download the
            `domesday-duplicator-update-*.dddfw` file and open it from the capture
            application — *Tools ▸ Firmware ▸ Update firmware…*.

            **Bringing up a new or legacy board**: download the
            `domesday-duplicator-provisioning-*.dddfw` file and open it from *Tools ▸
            Firmware ▸ Legacy ▸ Bring up a new or legacy board…*. Packaged builds of the
            application already carry a copy, so this is only needed when yours does not
            or when this set is newer than the one it carries.

            Everything else attached here is for bench work or for inspection.

            Every asset was built by CI from this tag. `SHA256SUMS` covers all of them,
            `PROVENANCE.txt` records the toolchains, and `bitstream-provenance.txt` carries
            the gateware digests in both release and canonical form so a rebuild can be
            compared against them.

            **The capture application releases separately**, under `gui-v*` tags.
