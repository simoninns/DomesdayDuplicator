name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/content/**'
      - 'docs/.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy main branch to GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # The docs tree used to be its own repository, so the shell steps below are all
        # written relative to it rather than to the repository root
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate navigation links
        run: |
          echo "Checking for external links in navigation sidebar..."
          
          # Check if Sidebar.md exists
          if [ ! -f "content/Sidebar.md" ]; then
            echo "Error: Sidebar.md not found"
            exit 1
          fi
          
          # Extract all markdown links from Sidebar.md and check for external URLs
          # Look for patterns like [text](http:// or [text](https://
          if grep -oE '\]\(https?://[^)]+\)' content/Sidebar.md > /dev/null; then
            echo "❌ ERROR: External links found in navigation sidebar!"
            echo ""
            echo "The following external links were detected:"
            grep -oE '\]\(https?://[^)]+\)' content/Sidebar.md
            echo ""
            echo "External links in the navigation are not allowed - Deployment failed"
            echo "Please create local placeholder pages and link to those instead."
            exit 1
          fi
          
          echo "✓ Navigation validation passed - no external links found"
      
      - name: Check internal markdown links
        run: |
          chmod +x check-internal-linkage.sh
          ./check-internal-linkage.sh
      
      - name: Check for orphaned pages
        run: |
          chmod +x check-orphans.sh
          ./check-orphans.sh
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/content
          destination: ./_site
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
