# Flatpak manifest for the capture application (P7-14).
#
# Runtime is org.kde.Platform because the application is Qt 6; the KDE runtime carries Qt
# itself, libusb and libFLAC, so this manifest builds one module and nothing else.
#
# The .desktop file, the AppStream metadata and the icons are installed by the CMake build
# (see src/DomesdayDuplicator/CMakeLists.txt) rather than copied here, so there is one
# definition of the application ID rather than two that can drift apart.
#
# SPDX-License-Identifier: GPL-3.0-or-later

app-id: io.github.simoninns.DomesdayDuplicator
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: DomesdayDuplicator

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11

  # Raw USB access to the capture device. Flatpak has no narrower static permission for
  # USB — --device=all is the only option that grants it, and the capture path is a libusb
  # bulk transfer, so there is no portal alternative. This is the permission a Flathub
  # review will ask about, and the answer is that the application's entire purpose is
  # talking to one specific USB 3.0 device.
  - --device=all

  # Serial control of Pioneer LD-V4300D and CLD-V2800 players, which is also raw device
  # access and is covered by --device=all above.

  # Captures are large and usually land on an external or secondary drive, and the file
  # chooser portal only grants the single file picked — which is no use for choosing an
  # output directory that a multi-hour capture then writes into.
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=/mnt

modules:
  - name: domesday-duplicator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      # Passed in by the packaging workflow. Without it CMake asks git, and there is no
      # .git inside a flatpak-builder sandbox, so the application would report its version
      # as "unknown" — which is exactly what P7-9 fails a release for.
      - -DDDD_VERSION=@DDD_VERSION@
    sources:
      - type: dir
        path: ../..
